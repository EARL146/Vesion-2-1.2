  <text x="94" y="267" fill="#b4becc" font-family="Arial,sans-serif" font-size="16">Orders</text>
  <text x="94" y="319" fill="#b4becc" font-family="Arial,sans-serif" font-size="16">Inventory</text>
  <text x="94" y="371" fill="#b4becc" font-family="Arial,sans-serif" font-size="16">Reports</text>
  <text x="94" y="423" fill="#b4becc" font-family="Arial,sans-serif" font-size="16">Settings</text>
