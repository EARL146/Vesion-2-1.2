  <text x="945" y="399" fill="#8993a1" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">STATUS</text>
  <path d="M318 419h783M318 475h783M318 531h783M318 587h783M318 643h783" stroke="#edf0f3" stroke-width="2"/>
