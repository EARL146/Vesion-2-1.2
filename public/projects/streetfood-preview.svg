<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">StreetFood desktop ordering system preview</title>
  <desc id="description">A dark restaurant point of sale interface concept with order cards and a sales table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#1e3147"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffba69"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#07101d" flood-opacity=".26"/></filter>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="24" fill="#f7f8fa"/>
