<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;
        var routes = ['projects', 'services', 'lab', 'versions', 'certificates', 'credentials', 'journey', 'about', 'contact'];
        var parts = l.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
        var last = (parts[parts.length - 1] || '').toLowerCase();
        if (routes.indexOf(last) !== -1) {
          var base = '/' + parts.slice(0, -1).join('/');
          if (base !== '/' && base.slice(-1) !== '/') base += '/';
          l.replace(l.protocol + '//' + l.host + base + '?p=/' + last + l.hash);
        } else {
          l.replace(l.protocol + '//' + l.host + '/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
